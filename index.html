/* Shared winter identity, November 2026 through February 2027 */
:root{--blue:#164a78;--orange:#ff7f00;--ink:#172e42;--ice:#e7f4ff}
body{background:linear-gradient(180deg,#e8f2fa,#f5f9fd 370px,#f7fafc);color:#1b3043}

.lux-preview-tag{font-size:11px;letter-spacing:.22em;color:#edc48a;font-weight:800;text-transform:uppercase;margin-bottom:16px}
.lux-frame{display:block;position:relative;width:min(460px,92vw);padding:13px;border:9px ridge #d7a75b;background:linear-gradient(130deg,#fce6a6,#ac691f,#eec774,#724016);box-shadow:0 25px 55px #000b,inset 0 0 9px #562c13;cursor:pointer;transition:transform .2s,filter .2s}
.lux-frame:hover,.lux-frame:focus-visible{transform:translateY(-5px);filter:brightness(1.1)}
.lux-frame img{width:100%;height:auto;display:block;max-height:none;object-fit:contain;background:#fff;border:2px solid #603d1d}
.lux-soon{width:min(460px,92vw);height:clamp(260px,42vw,390px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#254b6e,#07162c 75%);border:10px ridge #b88a4d;box-shadow:0 23px 53px #000a;color:#e7cf9f;gap:16px}
.lux-soon .silhouette{font-size:90px;opacity:.34;line-height:1}
.lux-soon strong{font-family:Georgia,serif;font-size:clamp(24px,4.5vw,43px);letter-spacing:.05em}
.lux-soon span{font-size:14px;letter-spacing:.2em;color:#f49b42;font-weight:900}
.lux-plaque{position:relative;background:linear-gradient(95deg,#8f5822,#efcc82 20%,#ffe8b5 50%,#d6a35a 80%,#86521a);color:#1a2637;border:2px solid #ffe6aa;padding:14px 25px;margin-top:17px;box-shadow:0 9px 22px #0008;min-width:min(400px,85vw);max-width:95%;font-family:Georgia,serif;font-size:clamp(23px,4vw,34px);font-weight:800}
.lux-plaque small{display:block;font:700 12px Inter,Arial,sans-serif;margin-top:5px;line-height:1.4}
.lux-profile-trigger{background:transparent;color:#ffda9e;border:1px solid #c89a55;border-radius:999px;padding:11px 26px;margin-top:19px;font-weight:800;letter-spacing:.045em}
.lux-profile-trigger:hover{background:#bb7d28;color:#07182e}
.lux-note{color:#cfdaea;text-align:center;padding:25px 12px;max-width:640px;margin:auto;font-size:12px;line-height:1.7}
.lux-overlay{position:fixed!important;inset:0!important;z-index:999999!important;display:flex;align-items:center;justify-content:center;background:#020b17ed;backdrop-filter:blur(12px);padding:14px;overflow-y:auto}
.lux-overlay.hidden{display:none!important}
.lux-dialog{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:min(1120px,100%);max-height:calc(100vh - 28px);overflow:auto;background:linear-gradient(145deg,#112f50,#061a30);border:1px solid #d2a35e;box-shadow:0 30px 90px #000d;color:#fff;border-radius:12px}
.lux-photo{background:#06162b;padding:20px;display:flex;align-items:center;justify-content:center}
.lux-photo img{max-width:100%;max-height:calc(100vh - 75px);object-fit:contain}
.lux-bio{padding:clamp(25px,4vw,58px);text-align:left}
.lux-bio .eyebrow{color:#efc589;font-weight:900;font-size:11px;letter-spacing:.22em}
.lux-bio h3{font-family:Georgia,serif;font-size:clamp(37px,5vw,64px);line-height:1;margin:17px 0 10px;color:#f8e4b4}
.lux-bio .award{color:#e7b770;font-weight:800;letter-spacing:.03em}
.lux-bio h4{font-size:12px;color:#e9c38c;letter-spacing:.19em;text-transform:uppercase;margin:34px 0 12px}
.lux-bio p{color:#d0dfef;line-height:1.8;font-size:15px}
.lux-close{position:absolute;right:16px;top:14px;width:44px;height:44px;border-radius:50%;background:#e4a75a;color:#071a30;border:0;font-size:24px;font-weight:900;z-index:2}
@media(max-width:680px){.lux-dialog{display:block}.lux-photo{padding:15px}.lux-photo img{max-height:38vh}.lux-bio{padding:24px}.lux-panel{padding-top:42px}.lux-intro{min-height:235px}}

.lux-hall{min-height:100svh;padding-bottom:65px}
.lux-panel{min-height:80vh;padding:75px 14px}

.lux-intro{min-height:270px}
.lux-intro h2{font-size:clamp(44px,7vw,93px)}
.lux-soon{width:min(500px,93vw);height:clamp(280px,40vw,430px)}
.lux-frame{width:min(525px,92vw);max-width:100%}
.lux-frame:focus-visible,.lux-profile-trigger:focus-visible{outline:3px solid #ffcb6b;outline-offset:5px}
.lux-overlay{z-index:9999999!important}
.lux-bio .award{font-size:17px}
.hero-accomplishment-state{color:#b1c2d2!important;font-style:italic}

.email-scheduler{border:1px solid #e3e8ed;border-radius:12px;padding:18px;text-align:left;margin-top:10px}
.email-scheduler h3{font-size:16px;margin:0 0 6px}
.email-scheduler .mailrow{display:grid;grid-template-columns:1fr minmax(142px,180px) minmax(110px,130px);gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #e1e8ed}
.email-scheduler input{padding:9px 7px;font-size:13px}
.email-scheduler .mailrow strong{font-size:13px}
.email-scheduler .mailrow small{font-size:10px;color:#63768a}
.email-scheduler .mailactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.email-scheduler button{font-size:12px}
.email-scheduler .email-note{font-size:12px;color:#5d7086;line-height:1.5}
@media(max-width:650px){#app .hero-in{gap:6px}#app .hero-in h1{font-size:19px}#app .nav button{font-size:12px}#app .content{padding:18px 13px 46px}.lux-panel{min-height:75vh;padding:60px 10px}.email-scheduler .mailrow{grid-template-columns:1fr 1fr}.email-scheduler .mailrow strong{grid-column:1/-1}}

function monthIndex(m){return heroMonths.indexOf(m)}

function renderHall(){
 const heroes=[...realHeroes,...demoNewHeroes].sort((a,b)=>{

  if(aIsOriginal&&bIsOriginal) return a.id==='clinton-sep-2026'?-1:1;

    const other=aIsOriginal?b:a;
    const future=other.year>2026||(other.year===2026&&monthIndex(other.month)>monthIndex('October'));
    return aIsOriginal?(future?1:-1):(future?-1:1);
  }
  return b.year-a.year||monthIndex(b.month)-monthIndex(a.month);
 });
 const latest=[...realHeroes,...demoNewHeroes].sort((a,b)=>b.year-a.year||monthIndex(b.month)-monthIndex(a.month))[0], next=latest?new Date(latest.year,monthIndex(latest.month)+1,1):new Date(2026,10,1);
 const nextMonth=heroMonths[next.getMonth()], nextYear=next.getFullYear();

 }
 html+=`</div><div class="lux-note">Every achievement is part of the Halco Way. New approved winners join the top of the gallery while past heroes remain on the wall forever.</div></div><div id="lux-overlay" class="lux-overlay hidden" role="dialog" aria-modal="true" aria-label="Hero recognition profile" onclick="if(event.target===this)closeLuxuryHero()"><div class="lux-dialog"><button class="lux-close" onclick="closeLuxuryHero()" aria-label="Close profile">×</button><div class="lux-photo"><img id="lux-detail-photo" alt="Hero portrait"></div><div class="lux-bio"><div class="eyebrow">THE HALCO WAY · HALL OF HEROES</div><h3 id="lux-detail-name"></h3><div class="award" id="lux-detail-award"></div><h4>Recognition Story</h4><p id="lux-detail-story"></p><h4>Accomplishments &amp; Milestones</h4><p id="lux-detail-accomplishments"></p></div></div></div>`;
 el('content').innerHTML=html;
}

function addDemoHero(){const name=el('new-hero-name')?.value.trim();if(!name)return alert('Enter a hero name.');const month=el('new-hero-month').value;const year=Number(el('new-hero-year').value);if(!Number.isInteger(year)||year<2026||year>2100)return alert('Enter a valid year.');const photoFile=el('new-hero-photo')?.files?.[0];if(!photoFile)return alert('Choose a photo for this demo hero.');const reader=new FileReader();reader.onload=()=>{demoNewHeroes.push({id:'demo-'+Date.now(),name,month,year,award:'Halco Hero',story:el('new-hero-story').value||'Recognition story to follow.',photo:reader.result});state.tab='hall';render();};reader.readAsDataURL(photoFile)}

function reset(){state.step='form';state.voter='';state.entries={};state.error=''}
function collect(){const v=el('voter');if(v)state.voter=v.value;for(const c of periods[state.period].categories){const n=el('n_'+c.id),r=el('r_'+c.id);if(n&&r)state.entries[c.id]={nominee:n.value,reason:r.value}}}
function adminChangePeriod(p){if(!Object.hasOwn(periods,p))return;state.period=p;reset();render()}
function adminToggle(){state.open=!state.open;reset();render()}
function saveAnnualCategories(){
  const categories=[...monthlyCategories];
  for(let i=0;i<5;i++){
    const name=el('annual-name-'+i)?.value.trim();

    categories.push({id:'annual_'+(i+1),name:name||'Annual Award '+(i+1),desc:desc||'Annual award name and description to be confirmed by the committee.'});
  }
  periods.dec.categories=categories;
  state.error='Categories updated in this preview only — they are not saved to the live website.';
  reset();state.error='Categories updated in this preview only — they are not saved to the live website.';

}
function render(){
 const p=periods[state.period];el('hero-title').textContent=state.open?p.title:'Voting Is Currently Closed';el('hero-month').textContent=state.open?p.month:'Awaiting the next voting period';
 el('nav-vote').className=state.tab==='vote'?'active':'';el('nav-admin').className=state.tab==='admin'?'active':'';el('nav-hall').className=state.tab==='hall'?'active':'';
 if(state.tab==='hall'){renderHall();return;}
 if(state.tab==='admin'){
  el('content').innerHTML=`<div class="card admin-card"><div class="award-kicker">THE HALCO WAY · ADMINISTRATION</div><h2>Halco Way Admin</h2><p class="muted">Administrator controls are available through the secured Google Spreadsheet. Sign in with your authorized Google work account, then select <strong>Halco Way Admin</strong> from the sheet's menu.</p><a class="primary" href="https://docs.google.com/spreadsheets/d/18T8rfbsP8yVnOyIRuAvsr8erwN1cj8qAYL1ZlETUxHg/edit" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;margin:12px 0">Open Secure Admin Controls ↗</a><p class="mini">Manage active voting period, opening/closing voting, five December award categories, hero publication, and email testing from the Sheet menu. This public GitHub page does not expose unauthenticated administrator actions.</p><div class="openstatus"><strong>Current voting status: ${state.open?'OPEN':'CLOSED'}</strong></div></div>`;
  return;
 }
 if(!state.open){el('content').innerHTML=`<div class="preview-banner">V2 TEST — Voting is currently closed in the backend</div><div class="card thank"><div class="success-icon">❄</div><h2>Voting Is Currently Closed</h2><p class="muted">The committee will open the next ballot when nominations are ready.</p><p class="mini">Employees cannot change months or access inactive ballots.</p></div>`;return;}
 let h=`<div class="preview-banner">V2 TEST — Submissions go to the V2 spreadsheet only while production voting is enabled.</div><p class="muted">${state.period==='dec'?'Nominate teammates for Halco Hero and the five annual award categories.':'Nominate a teammate who went above and beyond this month.'} One voting period is open at a time.</p>`;
 if(state.step==='form'){
  h+=`<div class="card"><div class="field"><label for="voter">Your Full Name</label><input id="voter" autocomplete="name" placeholder="Enter your first and last name" value="${esc(state.voter)}"><p class="mini">Used for nomination records. Multiple ballots are allowed.</p></div>`;
  p.categories.forEach((c,i)=>{const e=state.entries[c.id]||{};h+=`<section class="category"><div class="award-kicker">${i===0?'MONTHLY RECOGNITION':'ANNUAL RECOGNITION'}<span class="required">REQUIRED</span></div><h2 class="award-heading">${esc(c.name)}</h2><p class="muted">${esc(c.desc)}</p><div class="field"><label for="n_${c.id}">Who are you nominating?</label><input id="n_${c.id}" placeholder="Full name of your coworker" value="${esc(e.nominee)}"></div><div class="field" style="margin-bottom:0"><label for="r_${c.id}">Why this person?</label><textarea id="r_${c.id}" rows="3" placeholder="Tell us what they did that stood out">${esc(e.reason)}</textarea></div></section>`});
  h+=`<div id="error" class="validation">${esc(state.error)}</div><button class="primary wide" onclick="reviewBallot()">Review My Ballot →</button></div>`;
 }else if(state.step==='review'){
  h+=`<div class="card"><h2>Review Your Ballot</h2><p class="muted">Submitted by <strong>${esc(state.voter)}</strong>. Confirm your selections.</p>`;
  for(const c of p.categories){const e=state.entries[c.id];h+=`<div class="review-item"><div class="award-kicker">${esc(c.name)}</div><strong>${esc(e.nominee)}</strong><div class="reason">${esc(e.reason)}</div></div>`}
  h+=`<div class="action-row" style="margin-top:22px"><button class="outline" onclick="state.step='form';render()">Edit ballot</button><button class="primary" onclick="confirmV2Ballot()" ${state.submitting?'disabled':''}>${state.submitting?'Submitting…':'Submit nominations'}</button></div><p class="mini">The backend accepts votes only when an authorized administrator opens the selected period.</p></div>`;
 }else{
  h+=`<div class="card thank"><div class="success-icon">🎉</div><h2>Thank You for Recognizing Your Team!</h2><p class="muted">Your ballot was accepted by the V2 backend for ${esc(p.month)}.</p><p class="notice">Receipt: ${esc(state.receipt||'Recorded')}</p><button class="primary blue" style="margin-top:16px" onclick="reset();render()">Submit Another Ballot</button></div>`;
 }
 el('content').innerHTML=h;
}
function reviewBallot(){
 collect();if(!state.voter.trim()||state.voter.trim().split(/\s+/).length<2){state.error='Please enter your first and last name.';render();return}
 for(const c of periods[state.period].categories){const v=state.entries[c.id];if(!v?.nominee?.trim()||!v?.reason?.trim()){state.error='Please complete each open award category.';render();return}if(v.nominee.trim().toLowerCase()===state.voter.trim().toLowerCase()){state.error='Self-nominations are not allowed. Please update '+c.name+'.';render();return}}
 state.error='';state.step='review';render();
}
function playHalcoChime(){
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;for(const [i,f] of [659.25,987.77].entries()){const start=t+i*.19;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.18,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+.68);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.7)}setTimeout(()=>ctx.close().catch(()=>{}),1200)}catch(e){}
}
function enterHalcoVoting(){playHalcoChime();el('landing').classList.add('hidden');el('app').classList.remove('hidden');render();window.scrollTo(0,0)}
el('enter').addEventListener('click',enterHalcoVoting);

 {id:'open',title:'Voting opens',date:'2026-12-01',time:'07:00'},

function renderEmailScheduler(){
 const holder=el('email-scheduler');if(!holder)return;
 holder.innerHTML=`<div class="email-scheduler"><h3>Voting email calendar</h3><p class="email-note">Set the dates and times for five company-wide voting messages. All times are Eastern. These controls save in this browser only.</p>${demoMailSchedule.map((x,i)=>`<div class="mailrow"><strong>${esc(x.title)}</strong><input aria-label="${esc(x.title)} date" type="date" value="${esc(x.date)}" onchange="updateDemoMail(${i},'date',this.value)"><input aria-label="${esc(x.title)} time" type="time" value="${esc(x.time)}" onchange="updateDemoMail(${i},'time',this.value)"></div>`).join('')}<div class="mailactions"><button class="primary" onclick="saveDemoMail()">Save demo dates</button><button class="outline" onclick="resetDemoMail()">Reset dates</button></div><p id="email-scheduler-message" class="email-note" aria-live="polite">No messages will be sent.</p></div>`;

function updateDemoMail(i,k,v){demoMailSchedule[i][k]=v;let m=el('email-scheduler-message');if(m)m.textContent='Unsaved local change — no email has been scheduled.'}
function saveDemoMail(){

// --- V2 LIVE READ-ONLY CONNECTION ---
function v2PeriodKey(id){return { '2026-11':'nov','2026-12':'dec','2027-01':'jan','2027-02':'feb'}[id]||'nov'}
async function loadV2Public(){
 try {
   const response=await fetch(V2_API+'?action=status',{redirect:'follow',cache:'no-store'});
   if(!response.ok)throw Error('Backend status HTTP '+response.status);
   const status=await response.json();
   if(!status.ok)throw Error('Backend returned an invalid voting status');
   state.online=true;
   state.periodId=String(status.periodId||'2026-11');
   state.open=Boolean(status.votingOpen);
   state.period=v2PeriodKey(state.periodId);
   if(!periods[state.period]) {
     const [year,month]=state.periodId.split('-').map(Number);
     const monthName=heroMonths[month-1]||'Monthly';
     const key='current';
     periods[key]={title:'Vote For Your Halco Hero!',month:monthName+' '+year,categories:[...monthlyCategories]};
     state.period=key;
   }
   periods[state.period].month=(heroMonths[Number(state.periodId.slice(5))-1]||'Month')+' '+state.periodId.slice(0,4);
   if(Array.isArray(status.awards)&&status.awards.length){
     periods[state.period].categories=status.awards.map(a=>({id:String(a.id),name:String(a.name),desc:String(a.description||'Recognize a teammate.')}));
   }
 } catch(error) {
   state.online=false;state.open=false;
   console.error('Halco Way voting safely closed: status unavailable',error);
 }
 if(el('app')&&!el('app').classList.contains('hidden'))render();
 // The Wall of Heroes is optional: an unavailable photo service must not break voting.
 try {
   const response=await fetch(V2_API+'?action=heroes',{redirect:'follow',cache:'no-store'});
   if(!response.ok)throw Error('Hero HTTP '+response.status);
   const result=await response.json();
   if(!result.ok)throw Error('Hero data unavailable');
   const publishedHeroes=(Array.isArray(result.heroes)?result.heroes:[]).map((x,i)=>({
     id:'published-'+i,name:String(x.name||''),award:String(x.award||'Halco Hero'),
     month:String(x.month||''),year:Number(x.year)||2026,
     story:String(x.story||''),accomplishments:String(x.accomplishments||''),photo:String(x.photoUrl||'')
   })).filter(x=>x.name&&/^https:\/\//.test(x.photo));
   // Keep the two already approved original portraits; add later published heroes
   // only when they do not refer to the same person/award month.
   const known=new Set(originalApprovedHeroes.map(h=>h.name.toLowerCase()+'|'+h.month.toLowerCase()+'|'+h.year));
   realHeroes=[...originalApprovedHeroes,...publishedHeroes.filter(h=>
     !known.has(h.name.toLowerCase()+'|'+h.month.toLowerCase()+'|'+h.year))];
 } catch(error) {
   console.warn('Approved Heroes are not currently available',error);
 }
 if(el('app')&&!el('app').classList.contains('hidden'))render();
}
// Server-generated ID is preferred when available; client UUID identifies retry requests.
async function confirmV2Ballot(){
 if(state.submitting)return;
 if(!state.online||!state.open){state.error='Voting is currently closed or the backend is unavailable.';state.step='form';render();return}
 const p=periods[state.period];
 const entries=p.categories.map(c=>({awardId:c.id,nominee:state.entries[c.id].nominee.trim(),reason:state.entries[c.id].reason.trim()}));
 const id=state.pendingBallotId || (crypto.randomUUID ? crypto.randomUUID() : 'hw-'+Date.now()+'-'+Math.random().toString(36).slice(2));state.pendingBallotId=id;state.submitting=true;state.error='';render();
 try {
   // text/plain prevents a CORS preflight that Apps Script cannot answer.
   const result=await fetch(V2_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submitBallot',ballotId:id,voter:state.voter.trim(),periodId:state.periodId,entries}),redirect:'follow'});
   if(!result.ok)throw Error('Server returned HTTP '+result.status);
   const response=await result.json();
   if(!response.ok)throw Error(response.error||'Ballot was not accepted');
   state.receipt=response.receipt&&response.receipt.ballotId||id;
   state.step='thanks';state.pendingBallotId=null;
 } catch(err){
   state.error='Could not verify your submission. Do not submit again yet; contact the administrator with ballot ID '+id+'. '+String(err.message||err);
   state.step='form';
 } finally {state.submitting=false;render()}
}
loadV2Public();
